<script>
/* Local preview only: when opened from disk (file://), point folder links at their index.html.
   Has no effect on the live site. */
if (location.protocol === 'file:') {
  document.querySelectorAll('a[href]').forEach(function (a) {
    var h = a.getAttribute('href');
    if (/^[a-z]+:/i.test(h) || h.charAt(0) === '#') return;
    var parts = h.split('#');
    if (parts[0] === '' ) return;
    if (/\/$/.test(parts[0]) || parts[0] === '.' || parts[0] === '..') {
      parts[0] = parts[0].replace(/\/?$/, '/') + 'index.html';
      a.setAttribute('href', parts.join('#'));
    }
  });
}
</script>
